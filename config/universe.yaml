# Palm oil firms by exchange. The pilot uses SGX only (config/pilot.yaml, `exchange`).
# verify: true means listing status and ticker have not been checked against the exchange yet.
# Do that before trusting the pilot. IDX names are for Stage 2 (see docs/design.md).
exchanges:
  SGX: {index_name: Straits Times Index, index_ticker: "^STI", currency: SGD}
  IDX: {index_name: Jakarta Composite Index, index_ticker: "^JKSE", currency: IDR}

